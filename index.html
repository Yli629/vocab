<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>背单词</title>
<style>
:root{--bg:#0f172a;--card:#111c33;--ink:#e6edf7;--dim:#8fa3bf;--accent:#5eead4;--warn:#f87171;--ok:#4ade80;--mid:#fbbf24}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC",system-ui,sans-serif;display:flex;flex-direction:column;min-height:100dvh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid #1e2a44}
header .grow{flex:1}
.pill{font-size:12px;color:var(--dim);border:1px solid #24314f;border-radius:999px;padding:3px 10px}
.bar{height:4px;background:#1e2a44;border-radius:999px;overflow:hidden;margin:0 16px}
.bar>i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:16px}
.card{background:var(--card);border:1px solid #1e2a44;border-radius:20px;padding:28px 22px;min-height:260px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px;cursor:pointer;user-select:none}
.word{font-size:40px;font-weight:700;letter-spacing:.5px;word-break:break-word}
.pos{color:var(--dim);font-size:14px;margin-top:-6px}
.meaning{font-size:22px;color:var(--accent);line-height:1.5}
.hint{color:#5b6b86;font-size:13px}
.lv{font-size:12px;color:#5b6b86}
footer{padding:12px 16px 20px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
button{font:inherit;border:0;border-radius:14px;padding:16px 8px;color:#0b1220;font-weight:600;cursor:pointer}
.b-bad{background:#fca5a5}.b-mid{background:#fcd34d}.b-ok{background:#86efac}
button:disabled{opacity:.4}
.row{display:flex;gap:10px;padding:0 16px 12px}
.row button{flex:1;background:#1a2740;color:var(--ink);font-weight:500;padding:12px}
.empty{text-align:center;color:var(--dim);padding:40px 0}
.sheet{position:fixed;inset:0;background:#0b1220ee;display:none;flex-direction:column;padding:20px;overflow:auto;z-index:20}
.sheet.on{display:flex}
.sheet h2{margin:0 0 12px;font-size:18px}
.sheet label{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #1e2a44;font-size:15px}
.sheet input[type=number]{width:80px;background:#111c33;border:1px solid #24314f;color:var(--ink);border-radius:10px;padding:8px;font:inherit;text-align:center}
.sheet .close{margin-top:16px;background:#1a2740;color:var(--ink)}
.sheet textarea{width:100%;height:120px;background:#111c33;border:1px solid #24314f;color:var(--ink);border-radius:12px;padding:10px;font:14px/1.4 ui-monospace,monospace}
.list{max-height:60vh;overflow:auto;margin-top:10px}
.list div{padding:8px 0;border-bottom:1px solid #16223a;font-size:14px}
.list b{color:var(--accent)}
</style>
</head>
<body>
<header>
  <span class="pill" id="todayCount">0 / 0</span>
  <span class="pill" id="countdown">—</span>
  <span class="grow"></span>
  <span class="pill" id="totalCount">—</span>
  <button id="btnMenu" style="background:none;color:var(--dim);font-size:20px;padding:4px 8px">☰</button>
</header>
<div class="bar"><i id="barFill"></i></div>
<main>
  <div class="card" id="card">
    <div class="word" id="word">加载中…</div>
    <div class="pos" id="pos"></div>
    <div class="meaning" id="meaning" style="display:none"></div>
    <div class="hint" id="hint">轻点卡片看意思</div>
    <div class="lv" id="lv"></div>
  </div>
</main>
<footer>
  <button class="b-bad" id="bBad" disabled>不认识</button>
  <button class="b-mid" id="bMid" disabled>模糊</button>
  <button class="b-ok" id="bOk" disabled>认识</button>
</footer>

<div class="sheet" id="sheet">
  <h2>设置</h2>
  <label>每天新词 <input type="number" id="newPerDay" min="0" max="200" step="5"></label>
  <label>今天已学 <span id="todayNew">0</span></label>
  <label>总进度 <span id="progressTxt">—</span></label>
  <label>重置全部进度 <button id="btnReset" style="background:#7f1d1d;color:#fee2e2;padding:8px 14px">重置</button></label>
  <h2 style="margin-top:24px">导出 / 导入</h2>
  <textarea id="io" placeholder="进度 JSON"></textarea>
  <div class="row" style="padding:10px 0 0">
    <button id="btnExport" style="background:#1a2740;color:var(--ink)">导出</button>
    <button id="btnImport" style="background:#1a2740;color:var(--ink)">导入</button>
  </div>
  <h2 style="margin-top:24px">全部单词 <span class="pill" id="allCount"></span></h2>
  <div class="list" id="list"></div>
  <button class="close" id="btnClose">关闭</button>
</div>

<script src="words.js"></script>
<script>
const KEY='vocab_srs_v1';
const INTERVALS=[0,1,2,4,7,12,20];  // 冲刺节奏：一个月内反复见到
const els=id=>document.getElementById(id);

let state=load();
if(state.v<2){state.v=2;state.settings.newPerDay=40;save();}
let queue=[];
let idx=0;
let revealed=false;
let sessionDone=0;
let sessionTarget=0;

function todayStr(d=new Date()){
  const x=new Date(d.getTime()-d.getTimezoneOffset()*60000);
  return x.toISOString().slice(0,10);
}
function addDays(n){const d=new Date();d.setDate(d.getDate()+n);return todayStr(d);}

function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {v:2,settings:{newPerDay:40},day:{date:todayStr(),newCount:0},words:{}};
}
function save(){localStorage.setItem(KEY,JSON.stringify(state));}

function dailyNew(){return Math.max(0,Number(state.settings.newPerDay)||0);}

function buildQueue(){
  const t=todayStr();
  if(state.day.date!==t){state.day={date:t,newCount:0};save();}
  const due=[],fresh=[];
  for(const [w] of WORDS){
    const e=state.words[w];
    if(e){
      if(e.due<=t) due.push(w);
    }
  }
  due.sort((a,b)=>state.words[a].due.localeCompare(state.words[b].due)||state.words[a].lv-state.words[b].lv);
  const remainingNew=Math.max(0,dailyNew()-state.day.newCount);
  for(const [w] of WORDS){
    if(fresh.length>=remainingNew) break;
    if(!state.words[w]) fresh.push(w);
  }
  queue=[...due,...fresh];
  sessionDone=0;
  sessionTarget=queue.length;
  idx=0;
}

function render(){
  const t=todayStr();
  const learned=Object.keys(state.words).length;
  els('totalCount').textContent=`已学 ${learned}/${WORDS.length}`;
  els('progressTxt').textContent=`${learned} / ${WORDS.length}`;
  els('allCount').textContent=WORDS.length;
  const done=sessionDone;
  els('todayCount').textContent=`${done} / ${sessionTarget}`;
  els('barFill').style.width=sessionTarget?`${Math.min(100,done/sessionTarget*100)}%`:`100%`;
  els('todayNew').textContent=state.day.newCount;
  const days=Math.ceil((new Date('2026-12-03T00:00:00')-new Date())/86400000);
  els('countdown').textContent=days>0?`距 12/3 还有 ${days} 天`:'考试日到了';
  els('newPerDay').value=dailyNew();

  if(idx>=queue.length){
    els('word').textContent='今天的清完了';
    els('pos').textContent='';
    els('meaning').style.display='none';
    els('hint').textContent='明天再来';
    els('lv').textContent='';
    toggleButtons(false);
    return;
  }
  const w=queue[idx];
  const item=WORDS.find(x=>x[0]===w);
  els('word').textContent=item[0];
  els('pos').textContent=item[1];
  els('meaning').textContent=item[2];
  els('meaning').style.display=revealed?'block':'none';
  els('hint').textContent=revealed?'':'轻点卡片看意思';
  const e=state.words[w];
  els('lv').textContent=e?`等级 ${e.lv}${e.lapses?` · 错过 ${e.lapses} 次`:''}`:'新词';
  toggleButtons(revealed);
}

function toggleButtons(on){
  ['bBad','bMid','bOk'].forEach(id=>els(id).disabled=!on);
}

function grade(g){
  if(idx>=queue.length) return;
  const w=queue[idx];
  let e=state.words[w];
  const isNew=!e;
  if(!e) e=state.words[w]={lv:0,due:todayStr(),seen:0,lapses:0};
  e.seen++;
  if(g==='bad'){
    e.lv=0;e.lapses++;e.due=addDays(0);
    queue.push(w);           // 再来一次
    sessionTarget++;
  }else if(g==='mid'){
    e.due=addDays(1);
    e.lv=Math.max(0,e.lv);
  }else{
    e.lv=Math.min(INTERVALS.length-1,e.lv+1);
    e.due=addDays(INTERVALS[e.lv]);
  }
  if(isNew) state.day.newCount++;
  sessionDone++;
  save();
  idx++;revealed=false;
  render();
}

els('card').addEventListener('click',()=>{
  if(idx>=queue.length) return;
  revealed=true;render();
});
els('bBad').onclick=e=>{e.stopPropagation();grade('bad');};
els('bMid').onclick=e=>{e.stopPropagation();grade('mid');};
els('bOk').onclick=e=>{e.stopPropagation();grade('ok');};

els('btnMenu').onclick=()=>{
  els('sheet').classList.add('on');
  renderList();
  els('io').value='';
};
els('btnClose').onclick=()=>els('sheet').classList.remove('on');
els('newPerDay').onchange=e=>{
  state.settings.newPerDay=Math.max(0,Number(e.target.value)||0);
  save();buildQueue();render();
};
els('btnReset').onclick=()=>{
  if(!confirm('清空所有学习进度？')) return;
  state={v:2,settings:state.settings,day:{date:todayStr(),newCount:0},words:{}};
  save();buildQueue();render();
};
els('btnExport').onclick=()=>{
  els('io').value=JSON.stringify(state);
  els('io').select();
};
els('btnImport').onclick=()=>{
  try{
    const obj=JSON.parse(els('io').value);
    if(!obj||!obj.words) throw new Error('格式不对');
    state=obj;save();buildQueue();render();alert('导入成功');
  }catch(err){alert('导入失败：'+err.message);}
};

function renderList(){
  const el=els('list');
  el.innerHTML='';
  for(const [w,p,z] of WORDS){
    const e=state.words[w];
    const d=document.createElement('div');
    d.innerHTML=`<b>${w}</b> ${p} ${z} ${e?`<span style="color:#5b6b86">· L${e.lv}</span>`:''}`;
    el.appendChild(d);
  }
}

buildQueue();
render();
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});}
</script>
</body>
</html>
