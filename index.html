<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>背单词</title>
<style>
:root{--bg:#0f172a;--card:#111c33;--ink:#e6edf7;--dim:#8fa3bf;--accent:#5eead4;--bad:#f87171;--ok:#4ade80}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC",system-ui,sans-serif;display:flex;flex-direction:column;min-height:100dvh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid #1e2a44;flex-wrap:wrap}
header .grow{flex:1}
.pill{font-size:12px;color:var(--dim);border:1px solid #24314f;border-radius:999px;padding:3px 10px;white-space:nowrap}
.bar{height:4px;background:#1e2a44;border-radius:999px;overflow:hidden;margin:0 14px}
.bar>i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:14px;gap:12px}
.card{background:var(--card);border:1px solid #1e2a44;border-radius:20px;padding:26px 20px;min-height:170px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:8px}
.word{font-size:38px;font-weight:700;letter-spacing:.5px;word-break:break-word}
.pos{color:var(--dim);font-size:14px}
.result{font-size:18px;font-weight:600;min-height:26px}
.result.ok{color:var(--ok)}.result.bad{color:var(--bad)}
.meaning{font-size:20px;color:var(--accent);line-height:1.45}
.opts{display:grid;grid-template-columns:1fr;gap:10px}
.opt{width:100%;text-align:left;background:#182541;color:var(--ink);border:1px solid #24314f;border-radius:14px;padding:15px 16px;font:16px/1.4 inherit;cursor:pointer;transition:.15s}
.opt:active{transform:scale(.99)}
.opt.correct{background:#14532d;border-color:#22c55e;color:#dcfce7}
.opt.wrong{background:#7f1d1d;border-color:#ef4444;color:#fee2e2}
.opt:disabled{cursor:default}
.next{background:var(--accent);color:#06231e;font-weight:700;border:0;border-radius:14px;padding:16px;font:16px inherit;cursor:pointer}
.skip{background:none;border:0;color:#5b6b86;font:13px inherit;padding:10px;text-decoration:underline;cursor:pointer}
.empty{text-align:center;color:var(--dim);padding:40px 0}
.sheet{position:fixed;inset:0;background:#0b1220ee;display:none;flex-direction:column;padding:20px;overflow:auto;z-index:20}
.sheet.on{display:flex}
.sheet h2{margin:0 0 12px;font-size:18px}
.sheet label{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #1e2a44;font-size:15px}
.sheet input[type=number]{width:80px;background:#111c33;border:1px solid #24314f;color:var(--ink);border-radius:10px;padding:8px;font:inherit;text-align:center}
.sheet .close{margin-top:16px;background:#1a2740;color:var(--ink);border:0;border-radius:12px;padding:14px}
.sheet textarea{width:100%;height:110px;background:#111c33;border:1px solid #24314f;color:var(--ink);border-radius:12px;padding:10px;font:14px/1.4 ui-monospace,monospace}
.list{max-height:50vh;overflow:auto;margin-top:10px}
.list div{padding:8px 0;border-bottom:1px solid #16223a;font-size:14px}
.list b{color:var(--accent)}
.row{display:flex;gap:10px}
.row button{flex:1;background:#1a2740;color:var(--ink);border:0;border-radius:12px;padding:12px}
</style>
</head>
<body>
<header>
  <span class="pill" id="todayCount">0 / 0</span>
  <span class="pill" id="countdown">—</span>
  <button class="pill" id="btnWrong" style="background:none;cursor:pointer">错词 0</button>
  <span class="grow"></span>
  <span class="pill" id="totalCount">—</span>
  <button id="btnMenu" style="background:none;color:var(--dim);font-size:20px;padding:4px 8px;border:0">☰</button>
</header>
<div class="bar"><i id="barFill"></i></div>
<main>
  <div class="card">
    <div class="word" id="word">加载中…</div>
    <div class="pos" id="pos"></div>
    <div class="result" id="result"></div>
    <div class="meaning" id="meaning" style="display:none"></div>
  </div>
  <div class="opts" id="opts"></div>
  <button class="next" id="btnNext" style="display:none">下一个</button>
  <button class="skip" id="btnSkip">不认识，直接看答案</button>
</main>

<div class="sheet" id="sheet">
  <h2>设置</h2>
  <label>词库
    <span>
      <button class="deckbtn" data-deck="all" style="background:#1a2740;color:#e6edf7;border:0;border-radius:10px;padding:6px 10px">全部</button>
      <button class="deckbtn" data-deck="sat" style="background:#1a2740;color:#e6edf7;border:0;border-radius:10px;padding:6px 10px">SAT</button>
      <button class="deckbtn" data-deck="gre" style="background:#1a2740;color:#e6edf7;border:0;border-radius:10px;padding:6px 10px">GRE</button>
    </span>
  </label>
  <label>每天新词 <input type="number" id="newPerDay" min="0" max="200" step="5"></label>
  <label>今天已学 <span id="todayNew">0</span></label>
  <label>总进度 <span id="progressTxt">—</span></label>
  <label>重置全部进度 <button id="btnReset" style="background:#7f1d1d;color:#fee2e2;padding:8px 14px;border:0;border-radius:10px">重置</button></label>
  <h2 style="margin-top:22px">导出 / 导入</h2>
  <textarea id="io" placeholder="进度 JSON"></textarea>
  <div class="row" style="margin-top:10px">
    <button id="btnExport">导出</button>
    <button id="btnImport">导入</button>
  </div>
  <h2 style="margin-top:22px">全部单词 <span class="pill" id="allCount"></span></h2>
  <div class="list" id="list"></div>
  <button class="close" id="btnClose">关闭</button>
</div>

<script src="words.js"></script>
<script>
const DECK=(function(){
  const seen=new Set(),out=[];
  for(const x of WORDS){seen.add(x[0]);out.push([...x,'SAT']);}
  for(const x of GRE){if(!seen.has(x[0]))out.push([...x,'GRE']);}
  return out;
})();
function deckWords(){
  const d=(state.settings&&state.settings.deck)||'all';
  if(d==='all')return DECK;
  const tag=(d==='sat')?'SAT':'GRE';
  return DECK.filter(x=>x[3]===tag);
}
const KEY='vocab_srs_v2';
const INTERVALS=[0,1,2,4,7,12,20];
const els=id=>document.getElementById(id);

let state=load();
let queue=[],idx=0,answered=false,sessionDone=0,sessionTarget=0,currentOpts=[],chosenText='';
let mode='daily';

function todayStr(d=new Date()){
  const x=new Date(d.getTime()-d.getTimezoneOffset()*60000);
  return x.toISOString().slice(0,10);
}
function addDays(n){const d=new Date();d.setDate(d.getDate()+n);return todayStr(d);}

function load(){
  try{const raw=localStorage.getItem(KEY);if(raw)return JSON.parse(raw);}catch(e){}
  return {v:2,settings:{newPerDay:40},day:{date:todayStr(),newCount:0},words:{}};
}
function save(){localStorage.setItem(KEY,JSON.stringify(state));}
function dailyNew(){return Math.max(0,Number(state.settings.newPerDay)||0);}

function wrongWords(){
  return deckWords()
    .filter(([w])=>{const e=state.words[w];return e&&e.lapses>0&&e.lv<3;})
    .map(([w])=>w)
    .sort((a,b)=>{
      const A=state.words[a],B=state.words[b];
      return (B.lapses-A.lapses)||A.due.localeCompare(B.due)||(A.lv-B.lv);
    });
}

function buildQueue(){
  const t=todayStr();
  if(state.day.date!==t){state.day={date:t,newCount:0};save();}
  if(mode==='wrong'){
    queue=wrongWords();
    sessionDone=0;sessionTarget=queue.length;idx=0;
    return;
  }
  const due=[];
  for(const [w] of deckWords()){
    const e=state.words[w];
    if(e&&e.due<=t) due.push(w);
  }
  due.sort((a,b)=>state.words[a].due.localeCompare(state.words[b].due)||state.words[a].lv-state.words[b].lv);
  const remainingNew=Math.max(0,dailyNew()-state.day.newCount);
  const fresh=[];
  for(const [w] of deckWords()){
    if(fresh.length>=remainingNew) break;
    if(!state.words[w]) fresh.push(w);
  }
  queue=[...due,...fresh];
  sessionDone=0;sessionTarget=queue.length;idx=0;
}

function pickOptions(word){
  const item=DECK.find(x=>x[0]===word);
  const correct=item[2];
  const pool=[];
  const used=new Set([correct]);
  for(const w of DECK){
    if(w[0]===word) continue;
    if(used.has(w[2])) continue;
    used.add(w[2]);
    pool.push(w[2]);
  }
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
  const opts=[correct,...pool.slice(0,3)];
  for(let i=opts.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[opts[i],opts[j]]=[opts[j],opts[i]];}
  return {correct,opts};
}

function render(){
  const t=todayStr();
  const learned=Object.keys(state.words).length;
  els('totalCount').textContent=`已学 ${learned}/${deckWords().length}`;
  els('progressTxt').textContent=`${learned} / ${deckWords().length}`;
  els('allCount').textContent=deckWords().length;
  els('todayCount').textContent=`${sessionDone} / ${sessionTarget}`;
  els('barFill').style.width=sessionTarget?`${Math.min(100,sessionDone/sessionTarget*100)}%`:'100%';
  els('todayNew').textContent=state.day.newCount;
  els('newPerDay').value=dailyNew();
  const dk=(state.settings&&state.settings.deck)||'all';
  document.querySelectorAll('.deckbtn').forEach(b=>{
    const on=b.dataset.deck===dk;
    b.style.background=on?'#5eead4':'#1a2740';
    b.style.color=on?'#06231e':'#e6edf7';
  });
  const wn=wrongWords().length;
  els('btnWrong').textContent=`错词 ${wn}`;
  els('btnWrong').style.borderColor=(mode==='wrong')?'var(--accent)':'#24314f';
  els('btnWrong').style.color=(mode==='wrong')?'var(--accent)':'var(--dim)';
  const days=Math.ceil((new Date('2026-12-03T00:00:00')-new Date())/86400000);
  els('countdown').textContent=days>0?`距 12/3 还有 ${days} 天`:'考试日到了';

  if(idx>=queue.length){
    els('word').textContent=(mode==='wrong')?'错词本清空了':'今天的清完了';
    els('pos').textContent=(mode==='wrong')?'这些词你已经拿下了':'明天再来';els('meaning').style.display='none';
    els('result').textContent='';els('opts').innerHTML='';
    els('btnNext').style.display='none';els('btnSkip').style.display='none';
    return;
  }
  const w=queue[idx];
  const item=DECK.find(x=>x[0]===w);
  els('word').textContent=item[0];
  els('pos').textContent=item[1];
  els('result').textContent='';els('result').className='result';
  els('meaning').textContent=item[2];
  els('meaning').style.display=answered?'block':'none';
  els('btnNext').style.display=answered?'block':'none';
  els('btnSkip').style.display=answered?'none':'block';

  const box=els('opts');box.innerHTML='';
  if(!answered) currentOpts=pickOptions(w).opts;
  for(const o of currentOpts){
    const b=document.createElement('button');
    let cls='opt';
    if(answered){
      if(o===item[2]) cls+=' correct';
      else if(o===chosenText) cls+=' wrong';
    }
    b.className=cls;b.textContent=o;b.disabled=answered;
    if(!answered) b.onclick=()=>choose(o);
    box.appendChild(b);
  }
}

function choose(o){
  if(answered) return;
  const w=queue[idx];
  const item=DECK.find(x=>x[0]===w);
  answered=true;
  chosenText=o;
  const right=(o===item[2]);
  els('result').textContent=right?'✓ 对了':`✗ 记错了 · 正确：${item[2]}`;
  els('result').className='result '+(right?'ok':'bad');
  grade(right?'ok':'bad',right);
  render();
}

function grade(kind,right){
  const w=queue[idx];
  let e=state.words[w];
  const isNew=!e;
  if(!e) e=state.words[w]={lv:0,due:todayStr(),seen:0,lapses:0};
  e.seen++;
  if(!right){
    e.lv=0;e.lapses++;e.due=addDays(0);
    queue.push(w);sessionTarget++;
  }else{
    e.lv=Math.min(INTERVALS.length-1,e.lv+1);
    e.due=addDays(INTERVALS[e.lv]);
  }
  if(isNew) state.day.newCount++;
  sessionDone++;
  save();
}

function next(){
  if(!answered) return;
  answered=false;chosenText='';idx++;
  render();
}

document.querySelectorAll('.deckbtn').forEach(b=>{
  b.onclick=()=>{
    state.settings.deck=b.dataset.deck;save();
    mode='daily';buildQueue();render();
  };
});
els('btnWrong').onclick=()=>{
  mode=(mode==='wrong')?'daily':'wrong';
  buildQueue();render();
};
els('btnNext').onclick=next;
els('btnSkip').onclick=()=>{
  if(answered) return;
  const w=queue[idx];
  const item=DECK.find(x=>x[0]===w);
  answered=true;currentOpts=pickOptions(w).opts;
  els('result').textContent='记一下';
  els('result').className='result bad';
  grade('bad',false);
  render();
};
els('btnMenu').onclick=()=>{els('sheet').classList.add('on');renderList();els('io').value='';};
els('btnClose').onclick=()=>els('sheet').classList.remove('on');
els('newPerDay').onchange=e=>{state.settings.newPerDay=Math.max(0,Number(e.target.value)||0);save();buildQueue();render();};
els('btnReset').onclick=()=>{
  if(!confirm('清空所有学习进度？'))return;
  state={v:2,settings:state.settings,day:{date:todayStr(),newCount:0},words:{}};
  save();buildQueue();render();
};
els('btnExport').onclick=()=>{els('io').value=JSON.stringify(state);els('io').select();};
els('btnImport').onclick=()=>{
  try{
    const obj=JSON.parse(els('io').value);
    if(!obj||!obj.words)throw new Error('格式不对');
    state=obj;save();buildQueue();render();alert('导入成功');
  }catch(err){alert('导入失败：'+err.message);}
};
function renderList(){
  const el=els('list');el.innerHTML='';
  for(const [w,p,z,tag] of deckWords()){
    const e=state.words[w];
    const d=document.createElement('div');
    d.innerHTML=`<b>${w}</b> <span style="color:#5b6b86">${tag}</span> ${p} ${z}${e?` <span style="color:#5b6b86">· L${e.lv}</span>`:''}`;
    el.appendChild(d);
  }
}
buildQueue();render();
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});}
</script>
</body>
</html>
